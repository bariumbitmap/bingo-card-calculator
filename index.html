<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bingo 2026</title>
    <script src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
  </head>
  <body>
    <table id="main_table" border="1">
      <tr>
        <th scope="col"></th>
        <th scope="col">B</th>
        <th scope="col">I</th>
        <th scope="col">N</th>
        <th scope="col">G</th>
        <th scope="col">O</th>
        <th scope="col">diagonal: <output id="diagonal_up"></output>%</th>
      </tr>
      <tr>
        <th scope="row">1</th>
        <td><textarea id="B1text" class="description"></textarea><br><input id="B1" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="I1text" class="description"></textarea><br><input id="I1" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="N1text" class="description"></textarea><br><input id="N1" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="G1text" class="description"></textarea><br><input id="G1" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="O1text" class="description"></textarea><br><input id="O1" type="number" value=50 min=0 max=100>%</td>
        <td>row: <output id="row1"></output>%</td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td><textarea id="B2text" class="description"></textarea><br><input id="B2" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="I2text" class="description"></textarea><br><input id="I2" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="N2text" class="description"></textarea><br><input id="N2" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="G2text" class="description"></textarea><br><input id="G2" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="O2text" class="description"></textarea><br><input id="O2" type="number" value=50 min=0 max=100>%</td>
        <td>row: <output id="row2"></output>%</td>
      </tr>
      <tr>
        <th scope="row">3</th>
        <td><textarea id="B3text" class="description"></textarea><br><input id="B3" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="I3text" class="description"></textarea><br><input id="I3" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="N3text" class="description">Free Space</textarea><br><input id="N3" type="number" value=100 min=0 max=100>%</td>
        <td><textarea id="G3text" class="description"></textarea><br><input id="G3" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="O3text" class="description"></textarea><br><input id="O3" type="number" value=50 min=0 max=100>%</td>
        <td>row: <output id="row3"></output>%</td>
      </tr>
      <tr>
        <th scope="row">4</th>
        <td><textarea id="B4text" class="description"></textarea><br><input id="B4" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="I4text" class="description"></textarea><br><input id="I4" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="N4text" class="description"></textarea><br><input id="N4" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="G4text" class="description"></textarea><br><input id="G4" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="O4text" class="description"></textarea><br><input id="O4" type="number" value=50 min=0 max=100>%</td>
        <td>row: <output id="row4"></output>%</td>
      </tr>
      <tr>
        <th scope="row">5</th>
        <td><textarea id="B5text" class="description"></textarea><br><input id="B5" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="I5text" class="description"></textarea><br><input id="I5" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="N5text" class="description"></textarea><br><input id="N5" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="G5text" class="description"></textarea><br><input id="G5" type="number" value=50 min=0 max=100>%</td>
        <td><textarea id="O5text" class="description"></textarea><br><input id="O5" type="number" value=50 min=0 max=100>%</td>
        <td>row: <output id="row5"></output></td>
      </tr>
      <tr>
        <th scope="row"></th>
        <td>col: <output id="col1"></output>%</td>
        <td>col: <output id="col2"></output>%</td>
        <td>col: <output id="col3"></output>%</td>
        <td>col: <output id="col4"></output>%</td>
        <td>col: <output id="col5"></output>%</td>
        <td>diagonal: <output id="diagonal_down"></output>%</td>
      </tr>
    </table>
    <div>
      P(any): <output id="P_any"></output>%
    </div>
  </body>
</html>
