<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bingo card prediction calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
  </head>
  <body>
    <div id="main_table" class="container">
      <div class="big_header">B</div>
      <div class="big_header">I</div>
      <div class="big_header">N</div>
      <div class="big_header">G</div>
      <div class="big_header">O</div>
      <div>up diagonal: <output id="diagonal_up" class="num-output"></output>%</div>
      <div id="B1" class="cell"><textarea id="B1text" class="description text-input save-state load-state">Weird Al Yankovic wins on "Jeopardy!"</textarea><br><input id="B1num" class="number-input save-state load-state" type="number" value=4 min=0 max=100>%</div>
      <div id="I1" class="cell"><textarea id="I1text" class="description text-input save-state load-state">Weird Al Yankovic banned from local bubble wrap manufacturer</textarea><br><input id="I1num" class="number-input save-state load-state" type="number" value=96 min=0 max=100>%</div>
      <div id="N1" class="cell"><textarea id="N1text" class="description text-input save-state load-state">"Happy Days" reboot starring Weird Al Yankovic in every role</textarea><br><input id="N1num" class="number-input save-state load-state" type="number" value=8 min=0 max=100>%</div>
      <div id="G1" class="cell"><textarea id="G1text" class="description text-input save-state load-state">Weird Al Yankovic discovered incognito at a Renaissance Faire</textarea><br><input id="G1num" class="number-input save-state load-state" type="number" value=92 min=0 max=100>%</div>
      <div id="O1" class="cell"><textarea id="O1text" class="description text-input save-state load-state">Weird Al Yankovic inducted into the Rock & Roll Hall of Fame</textarea><br><input id="O1num" class="number-input save-state load-state" type="number" value=12 min=0 max=100>%</div>
      <div>P(row 1) = <output id="row1" class="num-output"></output>%</div>
      <div id="B2" class="cell"><textarea id="B2text" class="description text-input save-state load-state">Weird Al Yankovic creates revolutionary programming language that combines JavaScript and Klingon</textarea><br><input id="B2num" class="number-input save-state load-state" type="number" value=88 min=0 max=100>%</div>
      <div id="I2" class="cell"><textarea id="I2text" class="description text-input save-state load-state">New "Jurassic Park" movie starring Weird Al Yankovic in every role</textarea><br><input id="I2num" type="number" class="number-input save-state load-state" value=16 min=0 max=100>%</div>
      <div id="N2" class="cell"><textarea id="N2text" class="description text-input save-state load-state">Weird Al Yankovic voted Sexiest Man Alive</textarea><br><input id="N2num" class="number-input save-state load-state" type="number" value=84 min=0 max=100>%</div>
      <div id="G2" class="cell"><textarea id="G2text" class="description text-input save-state load-state">Weird Al Yankovic throws opening pitch for the Albuquerque Isotopes</textarea><br><input id="G2num" class="number-input save-state load-state" type="number" value=20 min=0 max=100>%</div>
      <div id="O2" class="cell"><textarea id="O2text" class="description text-input save-state load-state">Weird Al Yankovic inducted into International Polka Association Hall of Fame</textarea><br><input id="O2num" class="number-input save-state load-state" type="number" value=80 min=0 max=100>%</div>
      <div>P(row 2) = <output id="row2" class="num-output"></output>%</div>
      <div id="B3" class="cell"><textarea id="B3text" class="description text-input save-state load-state">Weird Al Yankovic and Wiz Khalifa team up to acquire Segway, Inc.</textarea><br><input id="B3num" class="number-input save-state load-state" type="number" value=24 min=0 max=100>%</div>
      <div id="I3" class="cell"><textarea id="I3text" class="description text-input save-state load-state">Weird Al Yankovic announces new line of ergonomic keyboards</textarea><br><input id="I3num" class="number-input save-state load-state" type="number" value=76 min=0 max=100>%</div>
      <div id="N3" class="cell"><textarea id="N3text" class="description text-input save-state load-state">Free Space</textarea><br><input id="N3num" class="number-input save-state load-state" type="number" value=100 min=0 max=100>%</div>
      <div id="G3" class="cell"><textarea id="G3text" class="description text-input save-state load-state">Weird Al Yankovic discovered living inside the Biggest Ball of Twine in Minnesota</textarea><br><input id="G3num" class="number-input save-state load-state" type="number" value=28 min=0 max=100>%</div>
      <div id="O3" class="cell"><textarea id="O3text" class="description text-input save-state load-state">Weird Al Yankovic turns down "World's Humblest Man" award from Mennonite Church</textarea><br><input id="O3num" class="number-input save-state load-state" type="number" value=72 min=0 max=100>%</div>
      <div>P(row 3) = <output id="row3" class="num-output"></output>%</div>
      <div id="B4" class="cell"><textarea id="B4text" class="description text-input save-state load-state">Michael Jackson estate apologizes, awards "Beat It" royalties to Weird Al Yankovic</textarea><br><input id="B4num" class="number-input save-state load-state" type="number" value=32 min=0 max=100>%</div>
      <div id="I4" class="cell"><textarea id="I4text" class="description text-input save-state load-state">Weird Al Yankovic pulled over by RCMP for driving a Zamboni all over Saskatchewan</textarea><br><input id="I4num" class="number-input save-state load-state" type="number" value=68 min=0 max=100>%</div>
      <div id="N4" class="cell"><textarea id="N4text" class="description text-input save-state load-state">Weird Al Yankovic acquires Holiday Inn, institutes mandatory chocolate mints on pillows</textarea><br><input id="N4num" class="number-input save-state load-state" type="number" value=36 min=0 max=100>%</div>
      <div id="G4" class="cell"><textarea id="G4text" class="description text-input save-state load-state">Weird Al Yankovic announces new comic book series "Torso Boy"</textarea><br><input id="G4num" class="number-input save-state load-state" type="number" value=64 min=0 max=100>%</div>
      <div id="O4" class="cell"><textarea id="O4text" class="description text-input save-state load-state">Weird Al Yankovic accepts lifetime achievement award from American Pancreatic Association</textarea><br><input id="O4num" class="number-input save-state load-state" type="number" value=40 min=0 max=100>%</div>
      <div>P(row 4) = <output id="row4" class="num-output"></output>%</div>
      <div id="B5" class="cell"><textarea id="B5text" class="description text-input save-state load-state">"Nature Trail to Hell" sweeps the Oscars</textarea><br><input id="B5num" class="number-input save-state load-state" type="number" value=60 min=0 max=100>%</div>
      <div id="I5" class="cell"><textarea id="I5text" class="description text-input save-state load-state">"Footloose" reboot starring Weird Al Yankovic playing polka in an Amish commune</textarea><br><input id="I5num" class="number-input save-state load-state" type="number" value=44 min=0 max=100>%</div>
      <div id="N5" class="cell"><textarea id="N5text" class="description text-input save-state load-state">Spatula City files for IPO</textarea><br><input id="N5num" class="number-input save-state load-state" type="number" value=56 min=0 max=100>%</div>
      <div id="G5" class="cell"><textarea id="G5text" class="description text-input save-state load-state">Euro Disney stock soars after mysterious computer virus causes investment surge</textarea><br><input id="G5num" class="number-input save-state load-state" type="number" value=48 min=0 max=100>%</div>
      <div id="O5" class="cell"><textarea id="O5text" class="description text-input save-state load-state">Weird Al Yankovic wins gold at World Table Tennis Championships</textarea><br><input id="O5num" class="number-input save-state load-state" type="number" value=52 min=0 max=100>%</div>
      <div>P(row 5) = <output id="row5" class="num-output"></output>%</div>
      <div>P(col B) = <output id="col1" class="num-output"></output>%</div>
      <div>P(col I) = <output id="col2" class="num-output"></output>%</div>
      <div>P(col N) = <output id="col3" class="num-output"></output>%</div>
      <div>P(col G) = <output id="col4" class="num-output"></output>%</div>
      <div>P(col O) = <output id="col5" class="num-output"></output>%</div>
      <div>down diagonal: <output id="diagonal_down" class="num-output"></output>%</div>
    </div>
    <div>
      P(any bingo): <output id="P_any" class="num-output"></output>%
    </div>
    <div>
      <input type="checkbox" id="rounding_on" checked>
      <label>Round to <input size="2" id="significant_figures" type="number" min="1" step="1" pattern="\d+" value="2" /> significant figures</label>
    </div>
    <div>
      <input type="button" id="shift_forward" value="Shift cells forward" /><br>
      <input type="button" id="shift_backward" value="Shift cells backward" /><br>
      <input type="button" id="shuffle_cells" value="Shuffle cells" /><br>
    </div>
    <div>
      <button id="export_json" type="button">Export JSON file</button><br>
      <label for="import_json">Import JSON file</label>
      <input id="import_json" type="file" multiple="false">
    </div>
  </body>
  <!-- Out takes:
    Biggest Ball of Twin in Minnesota goes missing, puzzling local authorities
    Weird Al Yankovic turns down Grammy award, saying he "has enough already"
  -->
</html>
