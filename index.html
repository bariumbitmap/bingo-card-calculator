<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bingo card prediction calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
  </head>
  <body>
    <div id="main_table" class="container">
      <div class="big_header">B</div>
      <div class="big_header">I</div>
      <div class="big_header">N</div>
      <div class="big_header">G</div>
      <div class="big_header">O</div>
      <div>up diagonal: <output id="diagonal_up"></output>%</div>
      <div><textarea id="B1text" class="description"></textarea><br><input id="B1" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="I1text" class="description"></textarea><br><input id="I1" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="N1text" class="description"></textarea><br><input id="N1" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="G1text" class="description"></textarea><br><input id="G1" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="O1text" class="description"></textarea><br><input id="O1" type="number" value=50 min=0 max=100>%</div>
      <div>P(row 1) = <output id="row1"></output>%</div>
      <div><textarea id="B2text" class="description"></textarea><br><input id="B2" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="I2text" class="description"></textarea><br><input id="I2" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="N2text" class="description"></textarea><br><input id="N2" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="G2text" class="description"></textarea><br><input id="G2" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="O2text" class="description"></textarea><br><input id="O2" type="number" value=50 min=0 max=100>%</div>
      <div>P(row 2) = <output id="row2"></output>%</div>
      <div><textarea id="B3text" class="description"></textarea><br><input id="B3" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="I3text" class="description"></textarea><br><input id="I3" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="N3text" class="description">Free Space</textarea><br><input id="N3" type="number" value=100 min=0 max=100>%</div>
      <div><textarea id="G3text" class="description"></textarea><br><input id="G3" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="O3text" class="description"></textarea><br><input id="O3" type="number" value=50 min=0 max=100>%</div>
      <div>P(row 3) = <output id="row3"></output>%</div>
      <div><textarea id="B4text" class="description"></textarea><br><input id="B4" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="I4text" class="description"></textarea><br><input id="I4" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="N4text" class="description"></textarea><br><input id="N4" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="G4text" class="description"></textarea><br><input id="G4" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="O4text" class="description"></textarea><br><input id="O4" type="number" value=50 min=0 max=100>%</div>
      <div>P(row 4) = <output id="row4"></output>%</div>
      <div><textarea id="B5text" class="description"></textarea><br><input id="B5" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="I5text" class="description"></textarea><br><input id="I5" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="N5text" class="description"></textarea><br><input id="N5" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="G5text" class="description"></textarea><br><input id="G5" type="number" value=50 min=0 max=100>%</div>
      <div><textarea id="O5text" class="description"></textarea><br><input id="O5" type="number" value=50 min=0 max=100>%</div>
      <div>P(row 5) = <output id="row5"></output></div>
      <div>P(col B) = <output id="col1"></output>%</div>
      <div>P(col I) = <output id="col2"></output>%</div>
      <div>P(col N) = <output id="col3"></output>%</div>
      <div>P(col G) = <output id="col4"></output>%</div>
      <div>P(col O) = <output id="col5"></output>%</div>
      <div>down diagonal: <output id="diagonal_down"></output>%</div>
    </div>
    <div>
      P(any): <output id="P_any"></output>%
    </div>
    <div>
      <input type="checkbox" id="rounding_on" checked>
      <label>Round to <input size="2" id="significant_figures" type="number" min="1" step="1" pattern="\d+" value="2" /> significant figures</label>
    </div>
  </body>
</html>
